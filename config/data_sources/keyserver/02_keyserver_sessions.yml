---
# Keyserver session table import
#
# Source: sessions.csv exported from Keyserver (one row per session).
#
# duration is stored in microseconds (bigint); Keyserver::Session#transform_import_value
# normalizes it from whichever of the three Excel/CSV encodings Roo produces
# (see that method for details). This CSV rake path imports the raw column
# directly and does not run transform_import_value — it relies on
# Util.valid_integer? for validation, so a raw Excel-epoch DateTime string for
# a multi-day session can still fail validation and drop the row here (a
# pre-existing gap in this import path, not introduced by this file).
#
# Columns intentionally excluded: idnt, agid.

load_sequence:        2
target_model:         'Keyserver::Session'
target_adapter:       'csv'
file_name:            'sessions.csv'
unique_keys:          [computer_name, user_name, logon]

column_mappings:
  Computer Name: computer_name
  User Name:     user_name
  Logon:         logon
  Logoff:        logoff
  Duration:      duration
  Address:       address
  Location:      location
